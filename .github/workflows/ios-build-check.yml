# Compiles the iOS app for the simulator, unsigned: checks that the Xcode
# project, Swift code and Swift packages build, without an Apple account.
name: iOS build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/ios/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package.json'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Placeholder Firebase config (real one is only needed at runtime)
        run: |
          cat > ios/App/App/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyLists-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>BUNDLE_ID</key><string>com.gavioesfc.sorteio</string>
            <key>PROJECT_ID</key><string>placeholder</string>
          </dict>
          </plist>
          PLIST

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
