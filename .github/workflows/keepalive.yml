# Evita o cold start do backend no Render (plano Free hiberna após 15 min sem
# requisições e leva ~1-2 min para acordar) e garante o aviso diário de aniversários.
#
# O backend verifica a cada 5 min (e logo após iniciar) se o aviso do dia já saiu a
# partir das 07:00 (BRT); basta acordá-lo de manhã. O GitHub costuma atrasar ou pular
# agendamentos frequentes, por isso a manhã tem três horários dedicados.
#
# O ping usa /api/health, que NÃO consulta o banco: o Neon continua podendo
# suspender sozinho (retoma em < 1 s) sem gastar a cota de horas do plano Free.
name: Backend keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'     # a cada 5 min (o GitHub pode atrasar execuções agendadas)
    - cron: '0,20,40 10 * * *' # 07:00, 07:20 e 07:40 (BRT): acorda o backend para o aviso de aniversários
  workflow_dispatch:

env:
  BACKEND_URL: https://fut-team-shuffle.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          # --max-time alto: se o serviço já tiver dormido, este ping o acorda
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 240 \
            --retry 2 --retry-delay 10 "$BACKEND_URL/api/health")
          echo "HTTP $status"
          cat response.json
          if [ "$status" -ge 400 ]; then exit 1; fi

  aniversarios:
    # Só nos horários da manhã; o envio é idempotente (uma vez por dia)
    if: github.event.schedule == '0,20,40 10 * * *' || github.event_name == 'workflow_dispatch'
    needs: ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar notificações de aniversário
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret CRON_SECRET não configurado; pulando (a verificação interna do backend envia assim que ele acorda)."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$BACKEND_URL/api/notificacoes/aniversarios/disparar")
          echo "HTTP $status"
          cat response.json
          if [ "$status" -ge 400 ]; then exit 1; fi
