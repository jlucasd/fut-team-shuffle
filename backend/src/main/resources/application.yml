spring:
  application:
    name: gavioes-fc-sorteio

  profiles:
    active: dev

app:
  auth:
    username: ${ADMIN_USERNAME:admin}
    # Set ONE of them in production. Neither set = every login is rejected.
    password: ${ADMIN_PASSWORD:}
    password-hash: ${ADMIN_PASSWORD_HASH:}

  firebase:
    # Service-account JSON from Firebase (raw or base64). Empty = push disabled.
    credentials: ${FIREBASE_CREDENTIALS:}

  notifications:
    # Daily birthday push (second minute hour day month weekday).
    cron: ${BIRTHDAY_CRON:0 0 9 * * *}
    zone: ${BIRTHDAY_ZONE:America/Sao_Paulo}
    # Shared secret for POST /api/notificacoes/aniversarios/disparar (external cron). Empty = disabled.
    cron-secret: ${CRON_SECRET:}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:gavioesfc
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8080

app:
  auth:
    # Local development only
    password: ${ADMIN_PASSWORD:admin123}

  jwt:
    secret: dev-secret-key-gavioes-fc-sorteio-2024-minimum-256-bits-long-key
    expiration: 86400000

  cors:
    allowed-origins: http://localhost:5173

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gavioesfc}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:gavioesfc}
    password: ${DB_PASSWORD:gavioesfc}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
